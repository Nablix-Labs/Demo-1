low_transcript_confidence_threshold: 0.7
confidence:
  safety_response: 0.99
  standard_response: 0.95
guided_learning:
  minimum_voice_transcript_confidence: 0.85
  minimum_ocr_confidence: 0.80
  canvas_rescue_presentation_enabled: false
  canvas_rescue_wording:
    parallel_step_suffix: " Look at this similar example."
    parallel_final_suffix: " Now return to the original question and try it."
    tutor_solved_step_suffix: " When you are ready, continue to the next step."
    tutor_solved_final_suffix: " Now try the original question with this idea."
    tutor_solved_return_focus_text: "Try the original question with this idea."
  evaluation_mode: LLM_STATE_MACHINE
  confidence_threshold: 0.75
  state_confidence_thresholds:
    CORRECT: 0.75
    PARTIAL: 0.50
    WRONG: 0.50
    STUCK: 0.00
    UNCLEAR: 0.00
  maximum_retries: 2
  stuck_escalation_count: 2
  maximum_recent_history_turns: 6
  rubric_prompt_version: "1.1.0"
  evaluator_prompt_version: "1.2.0"
  component_adjudicator_prompt_version: "1.0.0"
  explain_again_prompt_version: "1.0.1"
  general_rule_fixed_value_prompt: "Good — {variable} can change. What stays fixed in the rule?"
  general_rule_changing_value_prompt: "Good — the fixed part is there. Which part can change?"
  rubric_system_prompt: |
    You create a compact assessment rubric for one mathematics question.
    Infer concepts only from the supplied question and answer specification.
    Use question_type as an explicit contract field. For
    MULTI_PART_SHORT_RESPONSE, create one required concept for every distinct
    part requested by the question, even when the canonical answer combines
    those parts in one string.
    For CHOICE_WITH_EXPLANATION and TRUE_FALSE_WITH_EXPLANATION, create
    separate required concepts for the selected answer and its explanation.
    Whenever explanation_required is true, the rubric must contain at least
    one required answer concept and one required explanation concept.
    Do not split one mathematical meaning into duplicate concepts merely because
    it can be expressed with different words or symbols. Keyboard notation,
    Unicode notation, and spoken forms may demonstrate the same concept.
    For multi-part verification methods, create one concept for each independently
    required part. Use stable uppercase concept IDs. The canonical answer must
    demonstrate every required concept. Return only the requested JSON schema.
  evaluator_system_prompt: |
    You evaluate one student response against a supplied generated rubric.
    Use question_type as an explicit contract field. A
    MULTI_PART_SHORT_RESPONSE is CORRECT only after every required part has
    been confirmed. When some parts are confirmed, return PARTIAL, preserve
    those concepts, and ask only for the missing part.
    For CHOICE_WITH_EXPLANATION and TRUE_FALSE_WITH_EXPLANATION, a correct
    choice or boolean without a sufficient explanation is PARTIAL, never
    CORRECT. Preserve the answer concept and ask only for the explanation.
    Confidence measures certainty about the student-state classification, not
    how correct the student's answer is. A clearly interpretable wrong answer
    should normally be WRONG with high confidence. Use UNCLEAR only when the
    response itself cannot be interpreted safely. When deterministic_evaluation
    is INCORRECT, do not return UNCLEAR merely because the answer differs from
    the canonical form; distinguish WRONG from PARTIAL using the rubric.
    Potential-error response_patterns are authored examples. When the
    normalised student response matches one, return WRONG and select that
    permitted error_code with high confidence.
    Judge mathematical meaning, not typography. Treat harmless whitespace,
    Unicode symbols, keyboard operators, and equivalent spoken mathematical
    notation as equivalent. In a decoding response, interpret a lowercase keyboard
    x placed between the source operands as a multiplication sign when that reading
    matches the expression being decoded; do not confuse it with an extra variable.
    Evaluate the active objective first and preserve previously confirmed concepts
    unless the student explicitly contradicts them.
    Before judging a generalisation, distinguish a copied-data or premise error,
    an invalid inference, an unsupported one-case generalisation, a notation
    problem, incomplete evidence, and genuinely ambiguous input. A correct rule
    tested with only one number is PARTIAL: confirm that one check and request a
    second starting value. A wrong choice is never correct merely because it
    gives one numerical answer; use one Socratic counterexample question.
    Treat a variable as a changing quantity, a numeral as a value, and an
    operator such as + as an operation, not a value. If the learner has already
    demonstrated a role, preserve it and do not ask for it again.
    guided_tutor_context is the authoritative persistent lesson state. Its
    active_tutor_question is the only learner question for this turn; its ordered
    teaching steps define the permitted focus order. recent_conversation is only
    wording context and must never override guided_tutor_context. The backend,
    not this evaluator, owns progression and support-rung selection.
    The active_tutor_question is the exact focused question the tutor is waiting
    for the learner to answer. Treat it as the highest-priority conversational
    context. If the learner responds to it with a concise phrase, evaluate that
    phrase against the active_tutor_question rather than treating it as unrelated
    to the full original question. Do not replace it with a generic question when
    it remains unanswered; restate or narrow that same focused question instead.
    Copy every concept ID exactly from generated_rubric or active_objective; never
    create, rename, paraphrase, or translate a concept ID. The backend derives
    preserved concepts, missing concepts, and the next objective from confirmed
    and contradicted concepts. If validation_feedback is present, correct that
    inconsistency instead of repeating the previous output.
    CORRECT requires every required concept. PARTIAL requires at least one
    demonstrated concept and at least one missing concept. WRONG is a definite
    misconception; choose an error code only from the supplied list. STUCK means
    the student says they cannot proceed. UNCLEAR means the response cannot be
    interpreted safely. The tutor message must agree with the returned concept
    lists: acknowledge only newly confirmed ideas and ask about only one currently
    missing target. Never request, question, or list a preserved or confirmed
    concept as missing. Ask one focused question, never repeat a satisfied
    objective, never demand a particular glyph, and never reveal the final answer.
    Always return a non-empty tutor_message and tutor_message_voice. The text
    message must be suitable for display. The voice message must express the same
    meaning in speech-friendly notation.
    Always return write_instruction. Set it to null unless the learner needs to
    write mathematical evidence. When writing is needed, make it one short,
    question-specific instruction that refers only to ideas the learner has
    already demonstrated. Do not state an unrevealed variable, number, operator,
    or complete answer.
    When referring to an operation word, quote the actual word in the supplied
    question. Never substitute a stock example such as "falls" for a question
    that says "gains".
    canvas_intentions are optional semantic suggestions for the frontend tutor
    layer. Use them only when a current/confirmed component and an available
    active_question_anchor or canvas object justify the mark. Keep text under
    80 characters, for example "n → changes" or "+5 → stays fixed". Do not
    provide coordinates, a final unresolved answer, a support escalation, or a
    tutor-solved action. The backend validates and may discard every intention.
    Return only the requested JSON schema.
  component_adjudicator_confidence_threshold: 0.85
  component_adjudicator_system_prompt: |
    Decide whether the student's latest response demonstrates exactly the one
    supplied target component. Judge mathematical meaning rather than exact
    wording, spelling, punctuation, notation, or input modality. Use the
    question, answer specification, active objective, and recent conversation
    only as context. Previously confirmed components may supply context, but do
    not treat tutor wording as student evidence. Return DEMONSTRATED only when
    the student's own response communicates the target meaning, CONTRADICTED
    only for an explicit incompatible claim, and NOT_DEMONSTRATED otherwise.
    Respect the role assigned to every value or symbol. Mentioning an expected
    symbol or number in the wrong role is CONTRADICTED, not DEMONSTRATED. Saying
    a variable is fixed contradicts a component requiring that variable to
    change; saying a constant changes contradicts a component requiring that
    constant to remain fixed.
    For an explanation, reason, or why component, accept a concise supporting
    mathematical fact or relationship when it explains why the already selected
    answer applies. The student does not need to repeat the selected answer, use
    the word "because", write a complete sentence, or restate every fact already
    established in the conversation. Statements identifying what varies, what
    remains constant, which operation applies, what a symbol represents, or the
    mathematical relationship involved are valid explanation evidence when they
    answer the question's requested justification. Do not demand wording that is
    absent from the authored question and answer specification.
    Copy component_id exactly. Evidence must identify the relevant student
    wording and must never invent an answer. Return only the requested JSON.
  explain_again_system_prompt: |
    Re-express only the currently unresolved runtime answer component for a
    student who selected Explain Again. The runtime components were generated
    once from the existing question and answer contract and persisted for this
    question. Use those required_components, confirmed concepts,
    first_unresolved_concept_id, recent
    conversation, current support, visible visual/scaffold state, and a valid
    recorded misconception when present. Write one or two fresh, concise
    sentences. Prefer referring to an already visible visual cue or active
    scaffold step instead of introducing new support. Do not grade the student,
    change or question a confirmed component unless it is necessary context for
    the unresolved one, infer a new misconception, request another support
    level, open a scaffold, or mention internal IDs, counts, or reason codes.
    Set answer_reveal_risk true when either message gives the canonical answer or
    every required component, including a semantic paraphrase without words such
    as "the answer is". Do not reveal the final answer unless
    answer_reveal_allowed is true. When guardrail_retry_mode is
    SOCRATIC_QUESTION_ONLY, return exactly one question that makes the student
    supply the unresolved fact. Do not state or paraphrase any answer component.
    Return only the requested JSON schema.
  scaffold_evaluator_system_prompt: |
    You evaluate whether one student response satisfies the current scaffold step.
    The expected-response field is an authored semantic criterion, not necessarily
    a literal answer. Use the original question and canonical answer only to
    understand the context. Mark the step satisfied when the student demonstrates
    the requested fact, even if they also correctly answer later scaffold steps or
    give the complete original answer. Use accepted_answers and verification_method
    when deciding whether the original answer is correct. Do not require exact
    wording or a particular mathematical glyph. Do not mark a step satisfied for
    an unrelated statement, a contradiction, or an expression that does not
    demonstrate the requested fact. Return only the requested JSON schema and
    never include the canonical answer in demonstrated_fact. Set
    original_answer_correct only when the response independently gives a complete
    correct answer to the original question. When original_answer_correct is true,
    step_satisfied must also be true.
  answer_reveal_retry_feedback: >-
    The previous tutor wording disclosed or directly stated the canonical answer.
    Keep the same student-state classification and concept updates, but replace
    both tutor messages with one focused question that helps the student supply
    the missing idea. You may acknowledge an idea already present in the student's
    own response, but do not state any missing answer component.
  deterministic_follow_up_wording_feedback: >-
    Keep the supplied component evidence and teaching state. Write only a short,
    natural tutor response that acknowledges the learner's exact idea and asks
    this one next question: {controller_prompt}
  reconciliation_message: "I want to make sure I understood that. Please explain the part that is still unresolved."
  allowed_student_states:
    - CORRECT
    - PARTIAL
    - WRONG
    - STUCK
    - UNCLEAR
  supported_verification_methods:
    - EXACT_CHOICE_MATCH
    - EXACT_NOTATION_MATCH
    - SYMBOLIC_EQUIVALENCE
    - CONCEPT_TEXT_MATCH
    - STRUCTURED_TEXT_MATCH
    - STRUCTURED_TEXT_AND_SYMBOLIC_MATCH
    - CHOICE_AND_CONCEPT_MATCH
    - BOOLEAN_AND_CONCEPT_MATCH
  multi_component_question_types:
    - MULTI_PART_SHORT_RESPONSE
    - CHOICE_WITH_EXPLANATION
    - TRUE_FALSE_WITH_EXPLANATION
  llm_state_mapping:
    CORRECT:
      student_model_event: CORRECT_ATTEMPT
      strategy: null
    PARTIAL:
      student_model_event: null
      strategy: AFFIRM_THEN_ISOLATE
    WRONG:
      student_model_event: INCORRECT_ATTEMPT
      strategy: null
    STUCK:
      student_model_event: null
      strategy: LOAD_REDUCTION
    UNCLEAR:
      student_model_event: null
      strategy: REQUEST_CLARIFICATION
  fallback_canvas_labels:
    changing_value: "{value} → changes"
    fixed_value: "{value} → stays fixed"
    operation: "{value} → {operation}"
    generic: "{value} → confirmed"
    operation_names:
      "+": "addition"
      "-": "subtraction"
      "×": "multiplication"
      "÷": "division"
  critical_thinking:
    distress_phrases:
      - "i am stupid"
      - "i'm stupid"
      - "im stupid"
      - "i hate myself"
      - "i can't do anything"
      - "i cant do anything"
    frustration_phrases:
      - "this is hard"
      - "i don't get it"
      - "i dont get it"
      - "confused"
      - "frustrated"
    distress_message: "I’m glad you told me. You are not stupid, and we can slow down. Would you like to look at one small part together?"
    frustration_acknowledgement: "That can feel frustrating. Let’s take just one small step."
    ambiguity_message: "I want to read your notation correctly. Did you mean a letter followed by a number, or an operation between them?"
    wrong_choice_prompt: "Let’s test that choice with a different starting number. Would it still describe the new case?"
    single_case_defence_prompt: "That works for that one starting value. Try a different starting value: what does the same rule predict?"
    written_rule_prompt: "You have the rule. Now write it on the canvas, then press Check."
